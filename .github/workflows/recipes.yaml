---
name: recipes

on:
  pull_request:
    paths:
      - "recipes/**"
      - "libs/cwtrain/cwtrain/integrations/launch.py"
      - ".github/scripts/check_shared_recipe_files.py"
      - ".github/workflows/recipes.yaml"
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "libs/cwtrain/cwtrain/integrations/launch.py"

permissions:
  contents: read

jobs:
  shared-files:
    name: shared recipe files are identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so the token is not left in .git/config for later steps
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_shared_recipe_files.py
      - name: Shell scripts parse
        run: for f in recipes/*/*/k8s/*.sh; do bash -n "$f"; done

  launchers:
    name: recipe launchers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so the token is not left in .git/config for later steps
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -e 'libs/cwtrain[dev]'
      - run: pytest -q recipes/*/*/tests

