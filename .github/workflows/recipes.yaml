---
name: recipes

on:
  pull_request:
    paths:
      - "k8s/**"
      - "training/**"
      - "docs/**"
      - ".gitignore"
      - "libs/cwtrain/cwtrain/integrations/launch.py"
      - "libs/cwtrain/cwtrain/hotload/**"
      - ".github/workflows/recipes.yaml"
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "training/**"
      - "docs/**"
      - ".gitignore"
      - "libs/cwtrain/cwtrain/integrations/launch.py"
      - "libs/cwtrain/cwtrain/hotload/**"

permissions:
  contents: read

jobs:
  shell:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so the token is not left in .git/config for later steps
          persist-credentials: false
      - name: Shell scripts parse
        run: for f in k8s/*.sh training/recipes/*/k8s/*.sh training/case-studies/*/k8s/*.sh; do bash -n "$f"; done

  launchers:
    name: recipe launchers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so the token is not left in .git/config for later steps
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      # the cleanup-block tests also run the block in zsh, the default shell on macOS
      - run: sudo apt-get install -y -q zsh
      # omegaconf: the tests merge the recipes' and examples' configs as NeMo-RL and Gym do
      - run: uv pip install -e 'libs/cwtrain[dev]' omegaconf
      - run: pytest -q training/recipes/*/tests training/examples/*/tests training/case-studies/*/tests k8s/tests

