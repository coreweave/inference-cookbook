---
name: cwtrain

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - "libs/cwtrain/**"
      - ".github/workflows/cwtrain.yaml"
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "libs/cwtrain/**"
      - ".github/workflows/cwtrain.yaml"

permissions:
  contents: read

concurrency:
  group: cwtrain-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: libs/cwtrain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so the token is not left in .git/config for later steps
          persist-credentials: false
      # zizmor cannot evaluate the enable-cache expression below, which turns the cache off on tags
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 # zizmor: ignore[cache-poisoning]
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          # A tag build produces the released distributions, so it must not restore a cache.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # Every version needs release notes, so a version bump without them fails its pull request.
      # On a release tag, it also prevents publishing a package version different from the tag.
      # It needs only these files and runs before Install, so every leg stops within seconds.
      - name: Verify version and release notes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        shell: python
        run: |
          import os
          import re
          import tomllib  # Standard library since Python 3.11; CI uses 3.12+.
          from pathlib import Path

          lib = Path(os.environ["GITHUB_WORKSPACE"], "libs", "cwtrain")
          version = tomllib.loads((lib / "pyproject.toml").read_text())["project"]["version"]
          # A package that still spells out its own __version__ must agree with pyproject.toml.
          init = (lib / "cwtrain" / "__init__.py").read_text()
          literal = re.search(r"^__version__\s*=\s*[\"']([^\"']+)[\"']", init, re.M)
          if literal and literal.group(1) != version:
              raise SystemExit(
                  f"cwtrain/__init__.py says {literal.group(1)!r}; pyproject.toml says {version!r}"
              )
          # The release notes are the version's CHANGELOG.md section, "## X.Y.Z" or
          # "## X.Y.Z - YYYY-MM-DD", up to the next "## " heading, without the heading itself.
          heading = re.compile(rf"## {re.escape(version)}(?: - .+)?")
          notes, found = [], False
          for line in (lib / "CHANGELOG.md").read_text().splitlines():
              if line.startswith("## "):
                  if found:
                      break
                  found = heading.fullmatch(line.rstrip()) is not None
              elif found:
                  notes.append(line)
          # GitHub shows every line break in release notes, so each wrapped paragraph or list item
          # becomes one line. Blank lines, headings, tables, fenced code and new list items stay.
          lines, fenced = [], False
          for line in notes:
              item = line.lstrip()
              if item.startswith("```"):
                  fenced = not fenced
              previous = lines[-1].lstrip() if lines else ""
              if (
                  fenced
                  or item.startswith("```")
                  or not item
                  or not previous
                  or previous.startswith(("#", "|", "```"))
                  or re.match(r"([-*+]|\d+[.)]) |[#>|]", item)
              ):
                  lines.append(line)
              else:
                  lines[-1] += " " + item
          text = "\n".join(lines).strip()
          if not text:
              raise SystemExit(f"libs/cwtrain/CHANGELOG.md needs a '## {version}' section with notes")
          Path(os.environ["NOTES_FILE"]).write_text(text + "\n")
          if actual := os.environ["RELEASE_TAG"]:
              expected = f"v{version}"
              if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", actual):
                  raise SystemExit("Release tags must use stable SemVer: vMAJOR.MINOR.PATCH")
              if actual != expected:
                  raise SystemExit(f"Release tag {actual!r} must match {expected!r}")
      - name: Install
        # A CPU build of torch lets the NeMo-RL integration tests run instead of being skipped.
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[dev]' --group nemo-rl-tests
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Test native dashboard dataflow
        if: matrix.python == '3.12'
        run: |
          npm install --prefix "$RUNNER_TEMP/cwtrain-vega" --ignore-scripts --no-audit --no-fund vega@5.33.0
          VEGA_RUNTIME="$RUNNER_TEMP/cwtrain-vega/node_modules/vega" node tests/test_dashboard_vega.cjs
      - name: Build distributions
        run: uv build
      - name: Store release distributions
        if: startsWith(github.ref, 'refs/tags/v') && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cwtrain-distributions
          path: libs/cwtrain/dist/*
          if-no-files-found: error
          # "Re-run all jobs" uploads again into the same workflow run
          overwrite: true
      # A separate artifact, because the publish job uploads every file of the distributions.
      - name: Store release notes
        if: startsWith(github.ref, 'refs/tags/v') && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cwtrain-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    # after the reviewed PyPI upload, so a wrong tag creates nothing public before approval
    needs: [test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cwtrain-distributions
          path: dist/
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cwtrain-release-notes
          path: notes/
      - name: Create release with distribution assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The notes are the version's CHANGELOG.md section, which the test job checked.
          # Generated notes would list every pull request in the repository, not only cwtrain's.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A rerun after a failed asset upload completes the release and keeps its notes, which
            # may have been edited by hand.
            echo "Release $RELEASE_TAG already exists; uploading its assets again."
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --notes-file notes/release-notes.md --title "$RELEASE_TAG"
          fi

  publish:
    name: Publish cwtrain to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cwtrain/
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cwtrain-distributions
          path: dist/
      # setup-uv is on the repository's allowed-actions list; pypa/gh-action-pypi-publish is not.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # the interpreter the released distributions were built with
          python-version: "3.12"
          # nothing to restore for an upload, and a publishing job should not read caches
          enable-cache: false
      - name: Publish to PyPI
        # Trusted Publishing: uv trades this job's OIDC token for a short-lived PyPI upload token,
        # so no API token is stored anywhere. The GitHub release then carries these same files.
        run: uv publish --trusted-publishing always dist/*
