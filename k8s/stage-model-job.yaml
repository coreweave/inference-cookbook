#
# Stage the base model in the deployment's bucket. The Job downloads a Hugging Face checkpoint and
# uploads it with cwtrain's snapshot uploader, which applies the same validation as for hot-loads.
#
# Render from your example's k8s/ directory, where your run.env is:
#   ../../../../k8s/render.sh run.env ../../../../k8s/stage-model-job.yaml | kubectl apply -f -
# Requires the kit ConfigMap from make-kit.sh (KIT_NAME: wheel + scripts), and the Secret with the
# admin's AWS config and credentials files (ADMIN_STORAGE_SECRET, keys "config" and "credentials").
# The bucket policy does not let the trainer's key write the base model.
apiVersion: batch/v1
kind: Job
metadata:
  name: cwtrain-stage-${JOB_NAME}
  namespace: ${NAMESPACE}
  labels: {app.kubernetes.io/part-of: cwtrain-recipe}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: cwtrain-recipe, app.kubernetes.io/component: stage-model}
    spec:
      restartPolicy: Never
      containers:
      - name: stage
        image: python:3.12-slim
        command: ["bash", "/opt/cwtrain/stage-model.sh"]
        env:
        - {name: HF_MODEL, value: "${HF_MODEL}"}
        - {name: HF_REVISION, value: "${HF_REVISION}"}
        - {name: BUCKET, value: "${BUCKET}"}
        - {name: MODEL_PREFIX, value: "${MODEL_PREFIX}"}
        - {name: MODEL_SLUG, value: "${MODEL_SLUG}"}
        - {name: CW_S3_ENDPOINT, value: "${CW_S3_ENDPOINT}"}
        - {name: AWS_CONFIG_FILE, value: /aws/config}
        - {name: AWS_SHARED_CREDENTIALS_FILE, value: /aws/credentials}
        - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
        - {name: HF_HUB_ENABLE_HF_TRANSFER, value: "0"}
        volumeMounts:
        - {name: kit, mountPath: /opt/cwtrain, readOnly: true}
        - {name: aws, mountPath: /aws, readOnly: true}
        - {name: work, mountPath: /work}
        resources:
          requests: {cpu: "4", memory: 8Gi}
          limits: {cpu: "8", memory: 16Gi}
      volumes:
      - name: kit
        configMap: {name: ${KIT_NAME}}
      - name: aws
        secret: {secretName: ${ADMIN_STORAGE_SECRET}}
      - name: work
        emptyDir: {sizeLimit: 60Gi}
