#
# One-shot Job: create the checkpoint bucket with the admin's object-storage key
# (ADMIN_STORAGE_SECRET), then attach bucket-policy.example.json from the kit ConfigMap, filled in
# from run.env. The policy lets the inference service account and your org read, the trainer write
# only under HOTLOAD_PREFIX, and the admin stage the base model and clean up. It does the same as
# `aws s3api put-bucket-policy` from a laptop; use it when your credentials exist only in the
# cluster. It is safe to run again: it keeps the bucket's other statements, and it keeps the
# trainers and admins that an earlier run added next to this run.env's. It removes no principal.
#
# Render from your recipe's k8s/ directory, where your run.env is:
#   ../../../../k8s/render.sh run.env ../../../../k8s/make-bucket-job.yaml | kubectl apply -f -
# Requires the kit ConfigMap from make-kit.sh (KIT_NAME), which carries the policy template.
apiVersion: batch/v1
kind: Job
metadata:
  name: cwtrain-make-bucket
  namespace: ${NAMESPACE}
  labels: {app.kubernetes.io/part-of: cwtrain-recipe}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: cwtrain-recipe, app.kubernetes.io/component: make-bucket}
    spec:
      restartPolicy: Never
      containers:
      - name: make-bucket
        image: python:3.12-slim
        command: ["bash", "-c"]
        args:
        - |
          pip install --quiet boto3 >/dev/null 2>&1
          python - <<'PY'
          import boto3, json, os
          from botocore.config import Config
          bucket, zone = os.environ["BUCKET"], os.environ["BUCKET_ZONE"]
          if not zone:
              raise SystemExit("set BUCKET_ZONE to the bucket's CoreWeave Availability Zone, "
                               "for example US-EAST-04A")
          platform_arn, org = os.environ["PLATFORM_PRINCIPAL_ARN"], os.environ["ORG_ID"]
          trainer_arn, admin_arn = (os.environ[name].strip() for name in ("TRAINER_PRINCIPAL_ARN", "ADMIN_PRINCIPAL_ARN"))
          hotload_prefix = os.environ["HOTLOAD_PREFIX"].strip().strip("/")
          if not (trainer_arn and admin_arn and hotload_prefix):
              raise SystemExit("set TRAINER_PRINCIPAL_ARN, ADMIN_PRINCIPAL_ARN and HOTLOAD_PREFIX (the "
                               "deployment's hotLoad.pathPrefix); the trainer may write only there")
          if trainer_arn == admin_arn:
              print("WARNING: TRAINER_PRINCIPAL_ARN is ADMIN_PRINCIPAL_ARN, so the trainer's key has all of "
                    "the admin's rights: it can delete objects, and replace this policy through your org "
                    "access policies. Give the trainer its own principal (your recipe's README, "
                    "\"What you need\").")
          # Pick the endpoint in the trainer's order: CW_S3_ENDPOINT, else the endpoint in the
          # storage Secret's AWS config, else the primary CoreWeave endpoint.
          endpoint = os.environ.get("CW_S3_ENDPOINT", "").strip() or None
          cfg = Config(retries={"max_attempts": 2}, s3={"addressing_style": "virtual"})
          if endpoint is None:
              # Find out if the AWS config sets an endpoint: build clients for an unused region,
              # with and without the config. A configured URL is the same in every region; AWS's
              # default URL contains the region. Dummy keys skip the credential chain.
              probe = dict(region_name="cwtrain-endpoint-probe", aws_access_key_id="probe",
                           aws_secret_access_key="probe")
              honored = boto3.client("s3", **probe).meta.endpoint_url
              ignoring = Config(ignore_configured_endpoint_urls=True)
              default = boto3.client("s3", config=ignoring, **probe).meta.endpoint_url
              endpoint = "https://cwobject.com" if honored == default else None
          s3 = boto3.client("s3", endpoint_url=endpoint, region_name=zone, config=cfg)
          try:
              s3.create_bucket(Bucket=bucket, CreateBucketConfiguration={"LocationConstraint": zone})
              print(f"created bucket {bucket} in {zone}")
          except s3.exceptions.BucketAlreadyOwnedByYou:
              print(f"bucket {bucket} already exists (owned by you)")
          except s3.exceptions.BucketAlreadyExists:
              raise SystemExit(f"bucket name {bucket!r} is taken by another organization; choose another BUCKET")
          # bucket-policy.example.json holds the statements: AllowInference and AllowOrgUsers from the
          # Dedicated Inference docs ("Grant inference access to your bucket"), which only read,
          # AllowTrainer, which may add objects under the hot-load prefix but neither delete nor
          # change the policy, and AllowAdmin, the only one that may delete. Fill in its values.
          with open(os.environ["BUCKET_POLICY_TEMPLATE"]) as f:
              text = f.read()
          for placeholder, value in (("[BUCKET-NAME]", bucket), ("[ORG-ID]", org), ("[HOT-LOAD-PREFIX]", hotload_prefix)):
              text = text.replace(placeholder, value)
          policy = json.loads(text)
          ours = {st["Sid"]: st for st in policy["Statement"]}
          # Cloud Console users go under "CW"; service accounts (Workload Identity Federation) and
          # SAML users under "AWS".
          def principal(arn):
              return {"CW" if ":coreweave/" in arn else "AWS": [arn]}
          ours["AllowInference"]["Principal"] = {"CW": [platform_arn]}
          ours["AllowTrainer"]["Principal"] = principal(trainer_arn)
          ours["AllowAdmin"]["Principal"] = principal(admin_arn)
          # Another run of this Job must not lock out a trainer or admin that an earlier run added,
          # or drop statements that someone else wrote. So keep the other statements, and carry over
          # the principals and resources of an earlier AllowTrainer and AllowAdmin.
          try:
              current = json.loads(s3.get_bucket_policy(Bucket=bucket)["Policy"]).get("Statement", [])
          except Exception as exc:
              if (getattr(exc, "response", None) or {}).get("Error", {}).get("Code") != "NoSuchBucketPolicy":
                  raise
              current = []
          for st in current:
              mine = ours.get(st.get("Sid")) if st.get("Sid") in ("AllowTrainer", "AllowAdmin") else None
              if mine is None or not isinstance(st.get("Principal"), dict):
                  continue
              for key, arns in st["Principal"].items():
                  merged = mine["Principal"].setdefault(key, [])
                  merged += [a for a in ([arns] if isinstance(arns, str) else arns) if a not in merged]
              resources = st.get("Resource") or []
              mine["Resource"] += [r for r in ([resources] if isinstance(resources, str) else resources)
                                   if r not in mine["Resource"]]
          kept = [st for st in current if st.get("Sid") not in ours]
          policy["Statement"] = list(ours.values()) + kept
          s3.put_bucket_policy(Bucket=bucket, Policy=json.dumps(policy))
          print("policy attached:", [st["Sid"] for st in policy["Statement"]])
          print("trainers:", sum(ours["AllowTrainer"]["Principal"].values(), []))
          s3.put_object(Bucket=bucket, Key=os.environ.get("MODEL_PREFIX", "models").rstrip("/") + "/_probe/hello.txt", Body=b"hi")
          up = s3.create_multipart_upload(Bucket=bucket, Key=os.environ.get("MODEL_PREFIX", "models").rstrip("/") + "/_probe/mp.bin")
          s3.abort_multipart_upload(Bucket=bucket, Key=os.environ.get("MODEL_PREFIX", "models").rstrip("/") + "/_probe/mp.bin", UploadId=up["UploadId"])
          print("write + multipart OK with the admin key")
          PY
        env:
        - {name: BUCKET, value: "${BUCKET}"}
        - {name: BUCKET_ZONE, value: "${BUCKET_ZONE}"}
        - {name: PLATFORM_PRINCIPAL_ARN, value: "${PLATFORM_PRINCIPAL_ARN}"}
        - {name: ORG_ID, value: "${ORG_ID}"}
        - {name: TRAINER_PRINCIPAL_ARN, value: "${TRAINER_PRINCIPAL_ARN}"}
        - {name: ADMIN_PRINCIPAL_ARN, value: "${ADMIN_PRINCIPAL_ARN}"}
        - {name: HOTLOAD_PREFIX, value: "${HOTLOAD_PREFIX}"}
        - {name: BUCKET_POLICY_TEMPLATE, value: /kit/bucket-policy.example.json}
        - {name: MODEL_PREFIX, value: "${MODEL_PREFIX}"}
        - {name: CW_S3_ENDPOINT, value: "${CW_S3_ENDPOINT}"}
        - {name: AWS_CONFIG_FILE, value: /aws/config}
        - {name: AWS_SHARED_CREDENTIALS_FILE, value: /aws/credentials}
        - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
        volumeMounts:
        - {name: aws, mountPath: /aws, readOnly: true}
        - {name: kit, mountPath: /kit, readOnly: true}
        resources: {limits: {memory: 1Gi, cpu: "1"}, requests: {memory: 256Mi, cpu: "200m"}}
      volumes:
      - name: aws
        secret: {secretName: ${ADMIN_STORAGE_SECRET}}
      - name: kit
        configMap: {name: ${KIT_NAME}}
