#
# A dedicated namespace for the recipe's Jobs, ConfigMap and Secrets.
# Render from your recipe's k8s/ directory, where your run.env is:
#   ../../../../k8s/render.sh run.env ../../../../k8s/namespace.yaml | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels: {app.kubernetes.io/part-of: cwtrain-recipe}
