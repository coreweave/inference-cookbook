[project]
name = "cwtrain"
# The only place the version is set. The package reads it from its installed metadata, and the
# release workflow checks that the release tag matches it.
version = "0.1.0"
description = "Train against CoreWeave Dedicated Inference: deployments, checkpoint hot-load and rollouts for RL training loops"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "CoreWeave Applied Training" }, { name = "Fuyuan Bie", email = "fbie@coreweave.com"}]
keywords = [
    "coreweave",
    "dedicated-inference",
    "reinforcement-learning",
    "rl",
    "grpo",
    "rollouts",
    "hot-load",
    "checkpoint",
    "inference",
    "llm",
    "vllm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "boto3>=1.34",
    # Core: every recipe uses delta encoding (WeightMirror, write_delta).
    "numpy>=1.24",
    "zstandard>=0.21",
]

[project.urls]
Homepage = "https://github.com/coreweave/inference-cookbook"
Repository = "https://github.com/coreweave/inference-cookbook"
Documentation = "https://docs.coreweave.com/products/inference/rl-rollouts"
Issues = "https://github.com/coreweave/inference-cookbook/issues"

[project.optional-dependencies]
# NeMo-RL generation backend and weight synchronizer (torch for tensors, safetensors for exports)
nemo-rl = [
    "torch>=2.4",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
cwtrain = "cwtrain.cli:main"

[build-system]
# hatchling 1.27 is the first version that writes PEP 639 license metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwtrain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
