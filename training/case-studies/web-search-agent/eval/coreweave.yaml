# The target model on the NeMo-RL recipe's hot-load deployment. launch.py loads this after the
# benchmark's Gym config, then the benchmark's recipe config (browsecomp.yaml).
# Gym's vllm_model is an HTTP adapter, not a local inference engine.
policy_model:
  responses_api_models:
    vllm_model:
      # cwtrain_tool_app.py (copied in by `launch.py start`) is Gym's vllm_model server that also
      # turns the model's <tool_call> text into tool calls, for a deployment without a tool parser.
      entrypoint: cwtrain_tool_app.py
      base_url: ${oc.env:CWTRAIN_ROLLOUT_BASE_URL}
      api_key: ${oc.env:CWTRAIN_ROLLOUT_API_KEY}
      model: ${oc.env:CWTRAIN_ROLLOUT_MODEL}
      # Evaluation needs text and rewards, not training token IDs/log-probs.
      return_token_id_information: false
      is_responses_native: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: false
      # Nemotron non-thinking mode. For another model, change or remove this to match its template.
      chat_template_kwargs:
        enable_thinking: false
      extra_body:
        temperature: 0.0
