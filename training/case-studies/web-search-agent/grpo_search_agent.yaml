#
# The search agent: Gym's BrowseComp agent answers questions with You.com search and browse tools,
# and an LLM judge scores each answer. prepare_search_data.py writes the questions (SimpleQA by
# default). The recipe's grpo_coreweave.yaml supplies everything else; both are in the kit.
defaults: "grpo_coreweave.yaml"

grpo:
  max_val_samples: null

loss_fn:
  # The results in the README were trained without the recipe's truncated importance sampling.
  # Remove these two lines to train with it.
  use_importance_sampling_correction: false
  truncated_importance_sampling_type: null

policy:
  # Tokens per trajectory: the prompt, every turn and every tool result. At most the deployment's
  # max-model-len. One sequence's fp32 logits take about 0.5 MiB per token on top of 64 GiB of
  # training state per GPU once the optimizer state exists, so 16384 is the longest that fits the
  # 8 x H100 trainer.
  max_total_sequence_length: 16384

data:
  train:
    dataset_name: NemoGymDataset
    data_path: /work/hotload/nemo-gym/search.jsonl   # where prepare_search_data.py writes
  validation: null
  max_input_seq_length: null
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null

env:
  should_use_nemo_gym: true
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    # The LLM judge: any OpenAI-compatible endpoint. Its key comes from coreweave_secrets below.
    judge_model:
      responses_api_models:
        vllm_model:
          entrypoint: app.py
          base_url: https://api.inference.wandb.ai/v1
          api_key: unused
          model: zai-org/GLM-5.2
          return_token_id_information: false
          uses_reasoning_parser: true
          # A reasoning judge needs room for its answer after the reasoning.
          extra_body: {max_tokens: 8192}
    browsecomp_resources_server:
      resources_servers:
        browsecomp_advanced_harness:
          # The eval's You.com client (eval/you_search.py), which coreweave_files copies into the harness.
          entrypoint: you_search.py
          domain: agent
          verified: false
          debug: false
          tavily_api_key: unused
          # Sites that publish the questions with their answers (eval/exclude_domains.json).
          exclude_domains_file_path: /opt/cwtrain/exclude_domains.json
          use_judge: true
          judge_model_server: {type: responses_api_models, name: judge_model}
          judge_responses_create_params: {input: []}
    browsecomp_agent:
      responses_api_agents:
        browsecomp_agent:
          entrypoint: app.py
          resources_server: {type: resources_servers, name: browsecomp_resources_server}
          model_server: {type: responses_api_models, name: policy_model}
          max_steps: 12            # tool-calling turns per trajectory
          nudge_steps: true
          max_context_tokens: ${policy.max_total_sequence_length}
          # A context reset drops earlier turns, which breaks the trajectory's token prefix.
          # Training runs each trajectory in one context instead.
          max_reset_count: 0
          resume_from_trajectory: false
          save_model_call_using_vllm_tokenize_endpoint: false
    # Keys from the GYM_SECRET Secret, mounted at /secrets/gym. The Gym actor reads them, so the
    # keys stay out of the logged config.
    coreweave_secrets:
      judge_model.responses_api_models.vllm_model.api_key: /secrets/gym/judge_api_key
      browsecomp_resources_server.resources_servers.browsecomp_advanced_harness.tavily_api_key: /secrets/gym/search_api_key
    coreweave_files:
      resources_servers/browsecomp_advanced_harness/you_search.py: /opt/cwtrain/you_search.py
    coreweave_env:
      # Characters kept of each search or browse result, so that ~10 tool calls fit a trajectory.
      YOU_SEARCH_MAX_CHARS: "2000"
